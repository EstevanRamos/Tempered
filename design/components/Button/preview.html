<!doctype html>
<html data-theme="night">
<head><meta charset="utf-8"><title>Button</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<style>body{margin:0;padding:24px 32px;background:var(--ground);}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}</style></head>
<body>
<div class="row"><a class="tp-btn tp-btn--outline tp-btn--md" href="#"><span>Shop now</span><svg class="tp-arrow" viewBox="0 0 16 10" width="16" height="10" aria-hidden="true"><path d="M0 5h14.5M10.5 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1"/></svg></a><button class="tp-btn tp-btn--solid tp-btn--md">Add to bag</button><button class="tp-btn tp-btn--gold tp-btn--md"><span>Checkout</span><svg class="tp-arrow" viewBox="0 0 16 10" width="16" height="10" aria-hidden="true"><path d="M0 5h14.5M10.5 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1"/></svg></button><a class="tp-btn tp-btn--ghost tp-btn--md" href="#"><span>Our philosophy</span><svg class="tp-arrow" viewBox="0 0 16 10" width="16" height="10" aria-hidden="true"><path d="M0 5h14.5M10.5 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1"/></svg></a><button class="tp-btn tp-btn--outline tp-btn--md" disabled>Sold out</button></div>
</body>
</html>
