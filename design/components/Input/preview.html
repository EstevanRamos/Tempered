<!doctype html>
<html data-theme="night">
<head><meta charset="utf-8"><title>Input</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<style>body{margin:0;padding:24px 32px;background:var(--ground);}.stack{display:flex;flex-direction:column;gap:28px}</style></head>
<body>
<form class="stack" onsubmit="return false"><div class="tp-field"><label class="tp-field__label" for="e">Join the table</label><div class="tp-field__row"><input id="e" class="tp-field__input" type="email" placeholder="Email address"><button class="tp-field__go" aria-label="Subscribe"><svg class="tp-arrow" viewBox="0 0 16 10" width="16" height="10" aria-hidden="true"><path d="M0 5h14.5M10.5 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1"/></svg></button></div><p class="tp-field__hint">Drops and early access. No noise.</p></div><div class="tp-field is-error"><label class="tp-field__label" for="p">Postcode</label><div class="tp-field__row"><input id="p" class="tp-field__input" value="9021" aria-invalid="true"></div><p class="tp-field__msg">Enter a full postcode.</p></div></form>
</body>
</html>
