<!doctype html>
<html data-theme="night">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FloatingHeader</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz@6..96&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components.css">
<style>body{margin:0;background:var(--ground);}.hero-demo{position:relative;height:320px;overflow:hidden}.hero-demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.34) saturate(.55);z-index:-1}.hero-demo .tp-header--float{margin:0}</style></head>
<body>
<div class="hero-demo"><header class="tp-header tp-header--float"><nav class="tp-header__nav"><button class="tp-header__a tp-header__menu" type="button">Menu</button><a class="tp-header__a" href="#">Shop</a><a class="tp-header__a" href="#">Drops</a><a class="tp-header__a" href="#">Our story</a></nav><a class="tp-header__brand" href="#" aria-label="Tempered, home"><img class="tp-header__mark" src="../../assets/Logos/tempered-mark.png" alt=""></a><div class="tp-header__actions"><a class="tp-header__a" href="#">Search</a><a class="tp-header__a tp-header__a--wide" href="#">Account</a><button class="tp-header__a" type="button">Cart <span class="tp-count">2</span></button></div></header><img src="../../assets/Imagery/hero-elephant.webp" alt=""></div>
<p class="tp-eyebrow" style="margin:24px 32px">Scrolled</p>
<header class="tp-header tp-header--float is-solid" style="position:relative;margin:0"><nav class="tp-header__nav"><button class="tp-header__a tp-header__menu" type="button">Menu</button><a class="tp-header__a" href="#">Shop</a><a class="tp-header__a" href="#">Drops</a><a class="tp-header__a" href="#">Our story</a></nav><a class="tp-header__brand" href="#" aria-label="Tempered, home"><img class="tp-header__mark" src="../../assets/Logos/tempered-mark.png" alt=""></a><div class="tp-header__actions"><a class="tp-header__a" href="#">Search</a><a class="tp-header__a tp-header__a--wide" href="#">Account</a><button class="tp-header__a" type="button">Cart <span class="tp-count">2</span></button></div></header>
</body>
</html>
